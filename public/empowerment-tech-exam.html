    .header-banner { border-bottom: 2px solid #e5e7eb; padding-bottom: 0.75rem; margin-bottom: 1.25rem; }
    .header-banner small { color: var(--muted); font-weight: 600; display: block; }
    .header-banner strong { color: var(--primary); font-size: 1rem; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; gap: 1rem; flex-wrap: wrap; }
    .meta-group { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .badge { font-weight: 600; color: var(--muted); }
    .type-pill { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; padding: 0.25rem 0.65rem; border-radius: 999px; background: #f3f4f6; color: #374151; }
    .timer { font-size: 1.15rem; font-weight: 700; padding: 0.35rem 0.85rem; border-radius: 999px; background: #e0e7ff; color: var(--primary); }
    .timer.danger { background: #fee2e2; color: var(--accent); }
    .progress-track { width: 100%; height: 6px; background: #e5e7eb; border-radius: 999px; overflow: hidden; margin-bottom: 1.5rem; }
    .progress-fill { height: 100%; background: var(--primary); transition: width 0.2s ease; }
    h2 { margin-top: 0; font-size: 1.18rem; line-height: 1.55; }
    .sub-note { font-size: 0.9rem; color: var(--muted); margin-top: -0.5rem; margin-bottom: 1rem; }
    .login-form { display: grid; gap: 1rem; margin-top: 1rem; }
    .field-group label { display: block; font-weight: 600; font-size: 0.92rem; margin-bottom: 0.35rem; color: var(--text); }
    .rules-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 0.85rem 1rem; font-size: 0.9rem; color: #92400e; margin-top: 0.5rem; line-height: 1.5; }
    .choices { display: grid; gap: 0.7rem; margin: 1.25rem 0; }
    .choice-btn { text-align: left; padding: 0.85rem 1rem; border: 2px solid var(--border); border-radius: 8px; background: #fff; cursor: pointer; font-size: 0.98rem; line-height: 1.4; transition: 0.15s; }
    .choice-btn:hover { border-color: var(--primary); background: #f8fafc; }
    .choice-btn.selected { border-color: var(--primary); background: #eff6ff; font-weight: 600; }
    .mod-box { margin-top: 0.5rem; margin-bottom: 1.25rem; }
    .mod-box label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--accent); }
    .enum-grid { display: grid; gap: 0.65rem; margin: 1.25rem 0 1.5rem; }
    .text-input { width: 100%; padding: 0.75rem 0.9rem; border: 2px solid var(--border); border-radius: 8px; font-size: 1rem; }
    .text-input:focus { outline: none; border-color: var(--primary); }
    .actions { display: flex; justify-content: flex-end; margin-top: 1rem; }
    .next-btn { background: var(--primary); color: #fff; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .next-btn:hover { opacity: 0.92; }
    .student-meta-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 0.85rem 1rem; margin-bottom: 1rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.5rem; font-size: 0.92rem; }
    .score-box { background: #eff6ff; border: 2px solid var(--primary); border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
    .score-main { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin: 0 0 0.25rem; }
    .part-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.6rem; margin-bottom: 1.25rem; }
    .part-card { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 0.7rem 0.85rem; font-size: 0.9rem; }
    .print-btn { background: #1f2937; color: #fff; border: none; padding: 0.65rem 1.2rem; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-bottom: 1rem; }
    .summary-item { padding: 0.75rem 0; border-bottom: 1px solid #e5e7eb; font-size: 0.95rem; }
    @media print {
      body { background: #fff; padding: 0; }
      .card { box-shadow: none; max-width: 100%; padding: 0.5rem; }
      .print-btn { display: none; }
    }

      },

      // PART III: ENUMERATION (Items 51–60)
      {
        id: "ITEM-51-53",
        label: "Items 51–53 (3 pts)",
        type: "enumeration",
        duration: 120,
        question: "List three (3) common types of malware or online threats.",
        itemCount: 3,
        acceptedAnswers: [
          "virus",
          "worm",
          "trojan horse",
          "trojan",
          "ransomware",
          "spyware",
          "adware",
          "phishing"
        ]
      },
      {
        id: "ITEM-54-56",
        label: "Items 54–56 (3 pts)",
        type: "enumeration",
        duration: 120,
        question: "List three (3) core components or steps involved in a Mail Merge workflow in word processing.",
        itemCount: 3,
        acceptedAnswers: [
          "main document",
          "data source",
          "recipient list",
          "merge fields",
          "previewing/completing the merge",
          "previewing the merge",
          "completing the merge",
          "preview and complete merge"
        ]
      },
      {
        id: "ITEM-57-58",
        label: "Items 57–58 (2 pts)",
        type: "enumeration",
        duration: 120,
        question: "List two (2) visual design principles used when creating graphics or web layouts.",
        itemCount: 2,
        acceptedAnswers: [
          "balance",
          "contrast",
          "emphasis",
          "emphasis / contrast",
          "alignment",
          "proximity",
          "repetition",
          "hierarchy",
          "whitespace",
          "white space"
        ]
      },
      {
        id: "ITEM-59-60",
        label: "Items 59–60 (2 pts)",
        type: "enumeration",
        duration: 120,
        question: "List two (2) post-launch activities performed during ICT project maintenance and evaluation.",
        itemCount: 2,
        acceptedAnswers: [
          "updating content",
          "fixing broken links/bugs",
          "fixing broken links",
          "fixing bugs",
          "reviewing traffic/engagement analytics",
          "reviewing traffic",
          "reviewing engagement analytics",
          "gathering user feedback",
          "applying security updates"
        ]
      }
    ];

    const app = document.getElementById("app");
    let currentIndex = 0;
    let timeLeft = 0;
    let timerId = null;
    let isTransitioning = false;

    let studentInfo = {
      fullName: "",
      gradeLevelSection: "",
      examDate: new Date().toISOString().split("T")[0]
    };

    let selectedChoiceIndex = null;
    let tfSelection = null;
    let tfCorrectionText = "";
    let enumInputs = [];
    const results = [];

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatTypeLabel(type) {
      if (type === "multiple-choice") return "Part I • Multiple Choice";
      if (type === "true-false") return "Part II • Modifiable True or False";
      if (type === "enumeration") return "Part III • Enumeration";
      return "Exam Item";
    }

    function renderLoginScreen() {
      clearInterval(timerId);
      currentIndex = 0;
      results.length = 0;

      app.innerHTML = `
        <div class="header-banner">
          <small>REPUBLIC OF THE PHILIPPINES • DEPARTMENT OF EDUCATION</small>
          <strong>EMPOWERMENT TECHNOLOGIES — TERM 2 EXAMINATION (60 ITEMS)</strong>
        </div>
        <h2>Examinee Registration</h2>
        <p class="sub-note">Enter your Name, Grade &amp; Section, and Date. Item 1 and its countdown timer begin immediately after you proceed.</p>
        <div class="rules-box">
          <strong>Examination Timing &amp; Rules:</strong><br/>
          • Part I (Multiple Choice, Items 1–40): <strong>60 seconds</strong> per item.<br/>
          • Part II (Modifiable True or False, Items 41–50): <strong>120 seconds</strong> per item.<br/>
          • Part III (Enumeration, Items 51–60): <strong>120 seconds</strong> per item group.<br/>
          • When the timer reaches <strong>0s</strong>, the exam automatically advances to the next item.
        </div>
        <form class="login-form" id="login-form">
          <div class="field-group">
            <label for="learner-name">Name *</label>
            <input id="learner-name" type="text" class="text-input" placeholder="Last Name, First Name, M.I." required />
          </div>
          <div class="field-group">
            <label for="grade-level-section">Grade &amp; Section *</label>
            <input id="grade-level-section" type="text" class="text-input" placeholder="e.g., Grade 12 - ICT" required />
          </div>
          <div class="field-group">
            <label for="exam-date">Date *</label>
            <input id="exam-date" type="date" class="text-input" value="${escapeHtml(studentInfo.examDate)}" required />
          </div>
          <div class="actions">
            <button class="next-btn" type="submit">Start Examination →</button>
          </div>
        </form>
      `;

      document.getElementById("login-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const nameVal = document.getElementById("learner-name").value.trim();
        const sectionVal = document.getElementById("grade-level-section").value.trim();
        const dateVal = document.getElementById("exam-date").value;

        if (!nameVal || !sectionVal || !dateVal) return;

        studentInfo = {
          fullName: nameVal,
          gradeLevelSection: sectionVal,
          examDate: dateVal
        };

        startQuestion(0);
      });
    }

    function startQuestion(index) {
      clearInterval(timerId);
      isTransitioning = false;
      selectedChoiceIndex = null;
      tfSelection = null;
      tfCorrectionText = "";
      enumInputs = [];

      const item = examItems[index];
      timeLeft = item.duration || 60;
      const progressPct = ((index + 1) / examItems.length) * 100;

      app.innerHTML = `
        <div class="header-banner">
          <small>REPUBLIC OF THE PHILIPPINES • DEPARTMENT OF EDUCATION</small>
          <strong>EMPOWERMENT TECHNOLOGIES — TERM 2 EXAMINATION (60 ITEMS)</strong>
        </div>
        <div class="topbar">
          <div class="meta-group">
            <span class="badge">${item.label} (${index + 1} of ${examItems.length})</span>
            <span class="type-pill">${formatTypeLabel(item.type)}</span>
          </div>
          <div class="timer" id="timer">${timeLeft}s</div>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width: ${progressPct}%;"></div>
        </div>
        <h2>${escapeHtml(item.question)}</h2>
        <div id="answer-area"></div>
        <div class="actions">
          <button class="next-btn" id="next-btn" type="button">
            ${index === examItems.length - 1 ? "Submit Examination" : "Next Item →"}
          </button>
        </div>
      `;

      const answerArea = document.getElementById("answer-area");

      if (item.type === "enumeration") {
        const count = item.itemCount || 1;
        enumInputs = Array(count).fill("");
        const grid = document.createElement("div");
        grid.className = "enum-grid";

        for (let i = 0; i < count; i += 1) {
          const input = document.createElement("input");
          input.type = "text";
          input.className = "text-input";
          input.placeholder = `Answer ${i + 1}`;
          input.addEventListener("input", (e) => {
            enumInputs[i] = e.target.value.trim();
          });
          grid.appendChild(input);
        }
        answerArea.appendChild(grid);
      } else if (item.type === "true-false") {
        const note = document.createElement("p");
        note.className = "sub-note";
        note.textContent = "Select TRUE if the statement is correct. If FALSE, select FALSE and type the replacement word or phrase to make the statement true.";
        answerArea.appendChild(note);

        const choicesBox = document.createElement("div");
        choicesBox.className = "choices";

        const modBox = document.createElement("div");
        modBox.className = "mod-box";
        modBox.style.display = "none";
        modBox.innerHTML = `
          <label for="tf-correction">Replacement word/phrase to make the statement TRUE:</label>
          <input id="tf-correction" type="text" class="text-input" placeholder="Enter the replacement word or phrase..." />
        `;

        [
          { label: "TRUE", val: true },
          { label: "FALSE", val: false }
        ].forEach((opt) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "choice-btn";
          btn.textContent = opt.label;
          btn.addEventListener("click", () => {
            tfSelection = opt.val;
            [...choicesBox.children].forEach((el, i) => {
              el.classList.toggle("selected", (i === 0 && opt.val) || (i === 1 && !opt.val));
            });
            modBox.style.display = opt.val === false ? "block" : "none";
          });
          choicesBox.appendChild(btn);
        });

        answerArea.appendChild(choicesBox);
        answerArea.appendChild(modBox);

        const correctionInput = modBox.querySelector("#tf-correction");
        correctionInput.addEventListener("input", (e) => {
          tfCorrectionText = e.target.value.trim();
        });
      } else {
        const choicesBox = document.createElement("div");
        choicesBox.className = "choices";

        (item.choices || []).forEach((choiceText, idx) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "choice-btn";
          btn.textContent = `${String.fromCharCode(65 + idx)}. ${choiceText}`;

          btn.addEventListener("click", () => {
            selectedChoiceIndex = idx;
            [...choicesBox.children].forEach((el, i) => {
              el.classList.toggle("selected", i === idx);
            });
          });
          choicesBox.appendChild(btn);
        });

        answerArea.appendChild(choicesBox);
      }

      document.getElementById("next-btn").addEventListener("click", () => {
        completeQuestion(false);
      });

      const timerEl = document.getElementById("timer");
      timerId = setInterval(() => {
        timeLeft -= 1;
        if (timeLeft <= 0) {
          timerEl.textContent = "0s";
          timerEl.classList.add("danger");
          completeQuestion(true);
        } else {
          timerEl.textContent = `${timeLeft}s`;
          timerEl.classList.toggle("danger", timeLeft <= 10);
        }
      }, 1000);
    }

    function evaluateItem(item) {
      if (item.type === "enumeration") {
        const accepted = (item.acceptedAnswers || []).map((a) => a.toLowerCase().trim());
        const cleaned = enumInputs.map((v) => v.toLowerCase().trim()).filter(Boolean);
        const uniqueMatches = new Set(cleaned.filter((v) => accepted.includes(v)));
        const required = item.itemCount || 1;
        return {
          answerSummary: cleaned.length ? enumInputs.filter(Boolean).join(" | ") : "No answer",
          scoreEarned: Math.min(uniqueMatches.size, required),
          maxScore: required
        };
      }

      if (item.type === "true-false") {
        if (tfSelection === null) {
          return { answerSummary: "No answer", scoreEarned: 0, maxScore: 1 };
        }
        if (item.isTrue) {
          return {
            answerSummary: tfSelection ? "TRUE" : `FALSE (${tfCorrectionText || "no correction"})`,
            scoreEarned: tfSelection === true ? 1 : 0,
            maxScore: 1
          };
        }
        const normalizedCorrection = tfCorrectionText.toLowerCase().trim();
        const accepted = (item.acceptedCorrections || []).map((c) => c.toLowerCase().trim());
        const isCorrect = tfSelection === false && accepted.includes(normalizedCorrection);
        return {
          answerSummary: tfSelection
            ? "TRUE"
            : `FALSE — ${tfCorrectionText || "no replacement entered"}`,
          scoreEarned: isCorrect ? 1 : 0,
          maxScore: 1
        };
      }

      const isCorrect = selectedChoiceIndex === item.correctIndex;
      return {
        answerSummary:
          selectedChoiceIndex !== null && item.choices
            ? `${String.fromCharCode(65 + selectedChoiceIndex)}. ${item.choices[selectedChoiceIndex]}`
            : "No answer",
        scoreEarned: isCorrect ? 1 : 0,
        maxScore: 1
      };
    }

    function completeQuestion(autoAdvanced) {
      if (isTransitioning) return;
      isTransitioning = true;
      clearInterval(timerId);

      const item = examItems[currentIndex];
      const spentSeconds = (item.duration || 60) - Math.max(timeLeft, 0);
      const evalResult = evaluateItem(item);

      results.push({
        label: item.label,
        type: item.type,
        answerSummary: evalResult.answerSummary,
        scoreEarned: evalResult.scoreEarned,
        maxScore: evalResult.maxScore,
        spentSeconds,
        autoAdvanced
      });

      currentIndex += 1;
      if (currentIndex < examItems.length) {
        startQuestion(currentIndex);
      } else {
        renderSummary();
      }
    }

    function renderSummary() {
      const totalEarned = results.reduce((sum, r) => sum + r.scoreEarned, 0);
      const totalPossible = results.reduce((sum, r) => sum + r.maxScore, 0);
      const percentage = totalPossible > 0 ? ((totalEarned / totalPossible) * 100).toFixed(1) : "0.0";

      const part1Earned = results
        .filter((r) => r.type === "multiple-choice")
        .reduce((sum, r) => sum + r.scoreEarned, 0);
      const part2Earned = results
        .filter((r) => r.type === "true-false")
        .reduce((sum, r) => sum + r.scoreEarned, 0);
      const part3Earned = results
        .filter((r) => r.type === "enumeration")
        .reduce((sum, r) => sum + r.scoreEarned, 0);

      const responsesText = results
        .map((res) => `${res.label}: ${res.answerSummary} (${res.scoreEarned}/${res.maxScore})`)
        .join(" ; ");

      sendResultsToSheet({
        subject: "Empowerment Technologies — Term 2 Examination",
        fullName: studentInfo.fullName,
        gradeLevelSection: studentInfo.gradeLevelSection,
        examDate: studentInfo.examDate,
        totalEarned,
        totalPossible,
        percentage: `${percentage}%`,
        part1Earned,
        part2Earned,
        part3Earned,
        responsesText
      });

      const rows = results
        .map((res) => `
          <div class="summary-item">
            <strong>${res.label} (${formatTypeLabel(res.type)}):</strong>
            ${res.scoreEarned} / ${res.maxScore} pts
            <small>(${res.spentSeconds}s${res.autoAdvanced ? " • auto-advanced" : ""})</small><br/>
            <small>Response: ${escapeHtml(res.answerSummary)}</small>
          </div>
        `)
        .join("");

      app.innerHTML = `
        <div class="header-banner">
          <small>REPUBLIC OF THE PHILIPPINES • DEPARTMENT OF EDUCATION</small>
          <strong>EMPOWERMENT TECHNOLOGIES — TERM 2 EXAMINATION (60 ITEMS)</strong>
        </div>
        <h2>Examination Submitted — Score Report</h2>
        <div class="student-meta-box">
          <div><strong>Name:</strong> ${escapeHtml(studentInfo.fullName)}</div>
          <div><strong>Grade &amp; Section:</strong> ${escapeHtml(studentInfo.gradeLevelSection)}</div>
          <div><strong>Date:</strong> ${escapeHtml(studentInfo.examDate)}</div>
        </div>
        <div class="score-box">
          <p class="score-main">Total Score: ${totalEarned} / ${totalPossible} (${percentage}%)</p>
          <small>Submitted at ${new Date().toLocaleString()}</small>
        </div>
        <div class="part-grid">
          <div class="part-card"><strong>Part I (Multiple Choice):</strong><br/>${part1Earned} / 40 pts</div>
          <div class="part-card"><strong>Part II (Mod. True/False):</strong><br/>${part2Earned} / 10 pts</div>
          <div class="part-card"><strong>Part III (Enumeration):</strong><br/>${part3Earned} / 10 pts</div>
        </div>
        <button class="print-btn" id="print-score-btn" type="button">Print / Save Score Sheet</button>
        ${rows}
      `;

      document.getElementById("print-score-btn").addEventListener("click", () => {
        window.print();
      });
    }

    const GOOGLE_SHEET_WEB_APP_URL = "PASTE_YOUR_WEB_APP_URL_HERE";

    function sendResultsToSheet(payload) {
      if (!GOOGLE_SHEET_WEB_APP_URL || GOOGLE_SHEET_WEB_APP_URL.includes("https://script.google.com/macros/s/AKfycbyaowJlvWdvrEdIJcl6RoR7W1hY6YEGdXl4bxbzQXi-rIBotS58_e_se0oSw4C3bp0ehw/exec")) {
        return;
      }

      fetch(GOOGLE_SHEET_WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      }).catch((err) => {
        console.error("Failed to send score to Google Sheet:", err);
      });
    }

    renderLoginScreen();
  </script>
</body>
</html>
